services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poly_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-polymarket_sim}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poly_user} -d ${POSTGRES_DB:-polymarket_sim}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-poly_user}:${POSTGRES_PASSWORD:-poly_secret_password}@postgres:5432/${POSTGRES_DB:-polymarket_sim}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-poly_user}:${POSTGRES_PASSWORD:-poly_secret_password}@postgres:5432/${POSTGRES_DB:-polymarket_sim}
      - INITIAL_CAPITAL=50.0
      - ARB_SPREAD_THRESHOLD=0.015
      - GAS_FEE_USD=0.005
      - MAX_POSITION_PCT=0.50
    ports:
      - "${PORT:-8000}:8000"


volumes:
  pgdata:
