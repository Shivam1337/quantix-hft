services:
  postgres:
    image: postgres:16-alpine
    container_name: quantix-postgres
    environment:
      POSTGRES_DB: quantix_db
      POSTGRES_USER: quantix
      POSTGRES_PASSWORD: quantix_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantix -d quantix_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  quantix-hft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantix-hft
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://quantix:quantix_secret@postgres:5432/quantix_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
